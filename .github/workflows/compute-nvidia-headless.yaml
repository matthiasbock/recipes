
name: compute-nvidia-headless

on:
  push:
    paths:
      - '!.**'
      - '!**'
      - '.github/workflows/compute-nvidia-headless.yml'
      - 'containers/environments/compute/*'
      - 'containers/environments/compute/nvidia-headless/*'

  workflow_dispatch:

jobs:
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    env:
      workdir: ${{ github.workspace }}/containers/environments/compute/nvidia-headless
      image_tag: compute:nvidia-headless
      config: environments/compute/nvidia-headless/config.sh
    steps:
      - name: git checkout
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Build image from Dockerfile
        run: |
          cd "${{ env.workdir }}"
          podman build -t ${{ env.image_tag }} .

      - name: Publish image on Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: ${{ github.workspace }}/containers/push.sh ${{ env.config }}
