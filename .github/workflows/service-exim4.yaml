
name: service-exim4

on:
  push:
    paths:
      - '!.**'
      - '!**'
      - '.github/workflows/service-exim4.yml'
      - 'containers/services/exim4/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


jobs:
  build:
    name: Build image and publish on Docker Hub
    runs-on: ubuntu-latest
    env:
      config: services/exim4/amd64.sh
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true

      - name: Build container
        run: ${{ github.workspace }}/containers/build.sh ${{ env.config }}

      - name: Create image from container
        run: ${{ github.workspace }}/containers/commit.sh ${{ env.config }}

      - name: Publish image on Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: ${{ github.workspace }}/containers/push.sh ${{ env.config }}
