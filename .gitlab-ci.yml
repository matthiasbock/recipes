#
# Main CI/CD config file for GitLab runner
#

#
# By default run recipes in the container build environemnt
# (which itself is also built by a recipe in this repostory)
#
image: "registry.bihealth.org:443/bockm/recipes/buildenv:containers"


#
# Caching
#
default:
  cache:
    paths:
      - .cache/apt
      - .cache/pip

variables:
  APT_CACHE_DIR: "$CI_PROJECT_DIR/.cache/apt"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 1


#
# The list of active build recipes
#
include:
  - "containers/environments/build/cad/gitlab-ci.yml"
  - "containers/environments/build/containers/gitlab-ci.yml"
  - "containers/environments/build/coreboot/toolchain/gitlab-ci.yml"
  - "containers/environments/build/coreboot/gitlab-ci.yml"
  - "containers/environments/build/mesh-tools/gitlab-ci.yml"
  - "containers/environments/build/simulations/gitlab-ci.yml"
  - "containers/environments/test/bash-container-library/gitlab-ci.yml"
  - "containers/environments/test/python3/gitlab-ci.yml"
  - "containers/environments/test/python-ecg/gitlab-ci.yml"
  - "containers/environments/run/nodejs/gitlab-ci.yml"
  - "containers/environments/run/studies/gitlab-ci.yml"
  - "containers/services/gitlab-runner/gitlab-ci.yml"
  - "containers/systems/debian/gitlab-ci.yml"
  - "containers/systems/ubuntu/gitlab-ci.yml"
