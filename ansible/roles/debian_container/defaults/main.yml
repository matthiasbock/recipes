---
create: false
install: false
publish: false
remove: false

# Initial image to derive from
BASE_IMAGE: docker.io/debian:bookworm-slim

# Into the base image a minimal set of packages is installed
# to allow for the use of ansible modules
DIR_ASSETS: ../../lib/assets

# TODO:
# BOOTSTRAP_PACKAGE_LIST: "{{ DIR_ASSETS }}/apt/package-bundles/debian-essentials.list"
# INITIAL_PACKAGE_LIST: "{{ DIR_ASSETS }}/apt/package-bundles/console-tools.list"
INITIAL_SOURCES_LIST: "{{ DIR_ASSETS }}/apt/sources.list.d/bookworm.list"

REMOTE_BUILD_DIR: /tmp

# The tag name of the augmented base image
INITIAL_IMAGE_NAME: debian:bookworm

# From the initial image a container is instantiated
CONTAINER_NAME: debian

# A non-root user to create in the container
USER_NAME: www-data
USER_ID: 33
GROUP_NAME: www-data
GROUP_ID: 33
USER_SHELL: /bin/bash

# Replace apt sources.list files
DIR_SOURCES_LISTS: "{{ DIR_ASSETS }}/apt/sources.list.d"
SOURCES_LIST_FILES:
  - bookworm.list

# Append apt config files
DIR_APT_CONF: "{{ DIR_ASSETS }}/apt/apt.conf.d"
APT_CONF_FILES:
  - proxy.conf
  - suggestions.conf

# Define trusted apt keys
DIR_APT_KEYS: "{{ DIR_ASSETS }}/apt/keys" #/etc/apt/trusted.gpg.d
APT_KEY_FILES:
  - armbian.asc
  - blivet-gui.asc
  - jitsi.asc
  - microsoft.asc
  - openproject.asc
  - signal-messenger.asc
  - wire-messenger.asc
  - zoom.asc

# Install additional packages in the container
DIR_PACKAGE_BUNDLES: "{{ DIR_ASSETS }}/apt/package-bundles"
PACKAGE_BUNDLE_FILES:
  - debian-essentials.list
  - console-tools.list

# Optional: commit the container as new image
IMAGE_CMD: ["/bin/bash", "-l"]
IMAGE_NAME: debian:custom
# IMAGE_REPO: registry.gitlab.com/your-project/your-image
