---
- name: Install packages needed for SSL
  apt:
    name:
      - ca-certificates
      - apt-transport-https
    state: present
    update_cache: true
  ignore_errors: true
  when:
    - enable_ssl | bool

- name: Install Debian keyring
  apt:
    name:
      - debian-keyring
      - gnupg
    state: present
    update_cache: true
  ignore_errors: true
  when:
    - install_keyrings | bool

- name: Remove any sources.list files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list
    - /etc/apt/sources.list.d
  when:
    - remove_sources_lists | bool

- name: Remove apt configuration
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d
    - /etc/apt/sources.list
    - /etc/apt/sources.list.d
    - /etc/apt/trusted.gpg.d
  when:
    - remove_sources_lists

- name: Recreate apt configuration directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /etc/apt/apt.conf.d
    - /etc/apt/sources.list.d
    - /etc/apt/trusted.gpg.d

- name: Copy sources.list files
  copy:
    src: "{{ DIR_SOURCES_LISTS }}/{{ item }}"
    dest: "/etc/apt/sources.list.d/{{ item }}"
  loop: "{{ SOURCES_LIST_FILES }}"
  when: SOURCES_LIST_FILES is defined

- name: Copy apt configuration files
  copy:
    src: "{{ DIR_APT_CONF }}/{{ item }}"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
  loop: "{{ APT_CONF_FILES }}"
  when: APT_CONF_FILES is defined

- name: Install apt keys
  apt_key:
    content: "{{ lookup('file', item) }}"
  loop: "{{ APT_KEY_FILES }}"
  when:
    - install_apt_keys | bool

- name: Install additional keyrings
  apt:
    name:
      - debian-archive-keyring
      - debian-ports-archive-keyring
      - fasttrack-archive-keyring
      - emdebian-archive-keyring
      - debian-edu-archive-keyring
      - neurodebian-archive-keyring
      - ubuntu-keyring
      - ubuntu-archive-keyring
      - ubuntu-cloud-keyring
      - ubuntu-dbgsym-keyring
      - jitsi-archive-keyring
    state: present
    update_cache: true
  ignore_errors: true
  when:
    - install_keyrings | bool

- name: Install package bundles
  apt:
    name: "{{ lookup('file', DIR_PACKAGE_BUNDLES + '/' + item).splitlines() }}"
    state: present
    update_cache: true
  loop: "{{ PACKAGE_BUNDLE_FILES }}"
  ignore_errors: true
  when:
    - install_package_bundles | bool

- name: Clean up apt cache
  shell:
    cmd: |
      rm -vrf /var/lib/apt/lists/*
      rm -vfr /var/cache/apt/archives/*
  when:
    - cleanup_apt_cache | bool
