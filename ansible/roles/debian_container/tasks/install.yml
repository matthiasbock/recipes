---
#
# Operations on a Debian system
#
# Switches:
# * create_user
# * create_group
# * enable_ssl
# * install_keyrings
# * remove_apt_configuration
# * remove_sources_lists
# * install_sources_lists
# * install_apt_keys
#
- name: Configure group
  group:
    name: "{{ GROUP_NAME }}"
    gid: "{{ GROUP_ID | default(omit) }}"
  when:
    - create_group | bool

- name: Configure user
  user:
    name: "{{ USER_NAME }}"
    group: "{{ GROUP_NAME | default(omit) }}"
    uid: "{{ USER_ID | default(omit) }}"
    shell: "{{ USER_SHELL | default(omit) }}"
  when:
    - create_user | bool

- name: Install packages needed for SSL
  apt:
    name:
      - ca-certificates
      - apt-transport-https
    state: present
    update_cache: yes
  ignore_errors: true
  when:
    - enable_ssl | bool

- name: Install Debian keyring
  apt:
    name:
      - debian-keyring
      - gnupg
    state: present
    update_cache: yes
  ignore_errors: true
  when:
    - install_keyrings | bool

- name: Remove any sources.list files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list
    - /etc/apt/sources.list.d
  when:
    - remove_sources_lists | bool

- name: Remove apt configuration
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d
    - /etc/apt/sources.list
    - /etc/apt/sources.list.d
    - /etc/apt/trusted.gpg.d
  when:
    - remove_sources_lists

- name: Recreate apt configuration directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /etc/apt/apt.conf.d
    - /etc/apt/sources.list.d
    - /etc/apt/trusted.gpg.d

- name: Copy sources.list files
  copy:
    src: "{{ DIR_SOURCES_LISTS }}/{{ item }}"
    dest: "/etc/apt/sources.list.d/{{ item }}"
  loop: "{{ SOURCES_LIST_FILES }}"
  when: SOURCES_LIST_FILES is defined

- name: Copy apt configuration files
  copy:
    src: "{{ DIR_APT_CONF }}/{{ item }}"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
  loop: "{{ APT_CONF_FILES }}"
  when: APT_CONF_FILES is defined

- name:   Copy GPG public keys
  copy:
    src: "{{ DIR_APT_KEYS }}/{{ item }}"
    dest: "/etc/apt/trusted.gpg.d/{{ item }}"
  loop: "{{ APT_KEY_FILES }}"
  when:
    - install_apt_keys | bool

- name: Install additional useful packages
  apt:
    name:
      - debian-archive-keyring
      - debian-ports-archive-keyring
      - fasttrack-archive-keyring
      - emdebian-archive-keyring
      - debian-edu-archive-keyring
      - neurodebian-archive-keyring
      - ubuntu-keyring
      - ubuntu-archive-keyring
      - ubuntu-cloud-keyring
      - ubuntu-dbgsym-keyring
      - jitsi-archive-keyring
    state: present
    update_cache: yes
  ignore_errors: true
  when:
    - install_keyrings | bool

- name: Install packages from bundle files
  apt:
    name: "{{ lookup('file', DIR_PACKAGE_BUNDLES + '/' + item).splitlines() }}"
    state: present
    update_cache: yes
  loop: "{{ PACKAGE_BUNDLE_FILES }}"
  ignore_errors: true
  when:
    - install_package_bundles | bool

- name: Clean up the container
  shell:
    cmd: |
      apt-get clean
      rm -rf /var/lib/apt/lists/*
      rm -fr /var/cache/apt/archives/*
  when:
    - remove_temporary_files | bool
