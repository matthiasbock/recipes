#
# Tasks to run on the host after container setup
#
- name: Create Docker image
  when:
    - ansible_connection != 'docker'
  tags: image
  block:
    - name: Commit image
      community.docker.docker_image:
        name: "{{ IMAGE_NAME }}"
        source: container
        container_source: "{{ CONTAINER_NAME }}"
        user: "{{ USER_NAME | default('www-data') }}"
        command: "{{ IMAGE_CMD }}"

    - name: Push image to Docker image repository
      community.docker.docker_image:
        name: "{{ IMAGE_NAME }}"
        repository: "{{ IMAGE_REPO }}"
        push: yes
      when:
        - IMAGE_REPO is defined
      tags: publish

    - name: Delete image
      community.docker.docker_image:
        name: "{{ IMAGE_NAME }}"
        state: absent
      tags: purge

    - name: Delete container
      community.docker.docker_container:
        name: "{{ CONTAINER_NAME }}"
        state: absent
      tags: purge

