---
#
# Tasks to run on the remote host
#
- name: Create container
  tags: create
  block:
    - name: Ensure Docker is installed
      package:
        name: docker
        state: present

    - name: Ensure Docker service is started
      service:
        name: docker
        state: started

    - name: Create build directory
      file:
        path: "{{ REMOTE_BUILD_DIR }}"
        state: directory
        mode: '0755'

    - name: Copy files to remote host
      template:
        src: "{{ item }}"
        dest: "{{ REMOTE_BUILD_DIR }}/{{ item | basename }}"
        mode: '0644'
      loop:
        - Dockerfile.j2
        - "{{ INITIAL_SOURCES_LIST }}"

    - name: Get UID of remote user "{{ USER_NAME }}"
      command: id -u "{{ USER_NAME }}"
      register: get_uid
      changed_when: false

    - name: Get GID of remote group "{{ GROUP_NAME }}"
      command: id -g "{{ GROUP_NAME }}"
      register: get_gid
      changed_when: false

    - name: Update facts
      set_fact:
        USER_ID: "{{ get_uid.stdout }}"
        GROUP_ID: "{{ get_gid.stdout }}"
      changed_when: false

    # TODO:
    # - name: Enumerate initial packages
    #   set_fact:
    #     # Required for ansible tasks below: python3
    #     INITIAL_PACKAGES: "{{ lookup('file', INITIAL_PACKAGE_LIST).splitlines() }} python3"

    - name: Build initial image
      docker_image:
        name: "{{ INITIAL_IMAGE_NAME }}"
        build:
          path: "{{ REMOTE_BUILD_DIR }}"
        source: build

    - name: Create Debian container
      community.docker.docker_container:
        name: "{{ CONTAINER_NAME }}"
        hostname: "{{ CONTAINER_NAME }}"
        image: "{{ INITIAL_IMAGE_NAME }}"
        state: started
        detach: yes
        command: sleep infinity


- name: Docker socket forwarding via SSH tunnel
  delegate_to: localhost
  tags: configure
  block:
    - set_fact:
        DOCKER_SOCK_MAPPING: "{{ DOCKER_SOCK_LOCAL }}:{{ DOCKER_SOCK_REMOTE }}"
        SSH_LOGIN: "{{ ansible_user }}@{{ ansible_host }}"
      changed_when: false

    - set_fact:
        SSH_CMD: "ssh -fNL {{ DOCKER_SOCK_MAPPING }} -o ExitOnForwardFailure=yes {{ SSH_LOGIN }}"
        # ConnectTimeout=3,TCPKeepAlive=yes,ServerAliveInterval=2,ServerAliveCountMax=3,ForwardX11=no
      changed_when: false

    - name: Start Docker socket forwarding via SSH tunnel
      shell:
        cmd: |
          echo "SSH command: {{ SSH_CMD }}" >&2

          # Stop any already running instances of this command
          PID="$(echo "$(ps -eo pid,command | grep -E '[0-9]+\s+ssh ' | fgrep "{{ SSH_LOGIN }}" | fgrep "{{ DOCKER_SOCK_MAPPING }}" | sed -Ee 's/\s*([0-9]+).*$/\1/g')")"
          echo "Already running: $PID" >&2
          [[ "$PID" != "" ]] && kill $PID

          # Remove any left-over socket
          [[ -e "{{ DOCKER_SOCK_LOCAL }}" ]] && rm -vf "{{ DOCKER_SOCK_LOCAL }}" >&2

          # Start SSH tunnel
          set -e
          #timeout --foreground --preserve-status --signal=KILL {{ DOCKER_SOCK_TIMEOUT }} "{{ SSH_CMD }}" &
          {{ SSH_CMD }} || exit 3
          RETVAL=$?
          PID=$!

          [ $RETVAL -eq 0 ] || exit 100+$RETVAL
          echo $PID
      changed_when: false


#
# Tasks to run inside the container
#
- name: Configure container
  vars:
    ansible_connection: docker
    ansible_docker_extra_args: "--host {{ DOCKER_HOST }}"
    ansible_host: "{{ CONTAINER_NAME }}"
    ansible_user: root
  tags: configure
  block:
    - name: Configure group
      group:
        name: "{{ GROUP_NAME | default('www-data') }}"
        gid: "{{ GROUP_ID | default(omit) }}"

    - name: Configure user
      user:
        name: "{{ USER_NAME | default('www-data') }}"
        group: "{{ GROUP_NAME | default('www-data') }}"
        uid: "{{ USER_ID | default(omit) }}"
        shell: "{{ USER_SHELL | default('/bin/bash') }}"

    - name: Install packages required for secure package download
      apt:
        name:
          - ca-certificates
          - apt-transport-https
          - debian-keyring
          - gnupg
        state: present
        update_cache: yes

    - name: Remove existing sources.list files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list
        - /etc/apt/sources.list.d

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - /etc/apt/apt.conf.d
        - /etc/apt/sources.list.d
        - /etc/apt/trusted.gpg.d

    - name: Copy sources.list files
      copy:
        src: "{{ DIR_SOURCES_LISTS }}/{{ item }}"
        dest: "/etc/apt/sources.list.d/{{ item }}"
      loop: "{{ SOURCES_LIST_FILES }}"

    - name: Copy apt configuration files
      copy:
        src: "{{ DIR_APT_CONF }}/{{ item }}"
        dest: "/etc/apt/apt.conf.d/{{ item }}"
      loop: "{{ APT_CONF_FILES }}"

    - name: Copy GPG public keys
      copy:
        src: "{{ DIR_APT_KEYS }}/{{ item }}"
        dest: "/etc/apt/trusted.gpg.d/{{ item }}"
      loop: "{{ APT_KEY_FILES }}"

    - name: Install additional useful packages
      apt:
        name:
          - debian-archive-keyring
          - debian-ports-archive-keyring
          - fasttrack-archive-keyring
          - emdebian-archive-keyring
          - debian-edu-archive-keyring
          - neurodebian-archive-keyring
          - ubuntu-keyring
          - ubuntu-archive-keyring
          - ubuntu-cloud-keyring
          - ubuntu-dbgsym-keyring
          - jitsi-archive-keyring
        state: present
        update_cache: yes
      ignore_errors: true

    - name: Install packages from bundle files
      apt:
        name: "{{ lookup('file', DIR_PACKAGE_BUNDLES + '/' + item).splitlines() }}"
        state: present
        update_cache: yes
      loop: "{{ PACKAGE_BUNDLE_FILES }}"
      ignore_errors: true

    - name: Clean up the container
      shell:
        cmd: |
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -fr /var/cache/apt/archives/*


- name: Stop Docker socket forwarding via SSH tunnel
  delegate_to: localhost
  tags: configure
  shell:
    cmd: |
      PID="$(echo "$(ps -eo pid,command | grep -E '[0-9]+\s+ssh ' | fgrep "{{ SSH_LOGIN }}" | fgrep "{{ DOCKER_SOCK_MAPPING }}" | sed -Ee 's/\s*([0-9]+).*$/\1/g')")"
      echo "Stopping SSH: $PID" >&2
      [[ "$PID" != "" ]] && kill $PID
      [[ -e "{{ DOCKER_SOCK_LOCAL }}" ]] && rm -vf "{{ DOCKER_SOCK_LOCAL }}" >&2
  changed_when: false


- name: Verify container
  tags: verify
  block:
    - name: Check if container is running
      community.docker.docker_container_info:
        name: "{{ inventory_hostname }}"
      register: container_info

    - name: Display container status
      debug:
        msg: "Status of container {{ inventory_hostname }}: {{ container_info.container['State']['Status'] }}"

    - name: Verify user creation
      command:
        cmd: "docker exec {{ inventory_hostname }} id -u {{ USER_NAME }}"
      register: user_check
      changed_when: false


