---
#
# Create a Docker image using a Dockerfile
#
# Note:
# In order for Ansible to take over system configuration
# a minimal list of packages (e.g. python3)
# must first be installed.
# Here this is accomplished using a Dockerfile.
#
- name: Create Docker build directory
  file:
    path: "{{ REMOTE_BUILD_DIR }}"
    state: directory
    mode: "0755"

- name: Copy files to remote host
  template:
    src: "{{ item }}"
    dest: "{{ REMOTE_BUILD_DIR }}/{{ item | basename }}"
    mode: "0644"
  loop:
    - Dockerfile.j2
    - "{{ INITIAL_SOURCES_LIST }}"

- name: Get UID of remote user "{{ USER_NAME }}"
  command: id -u "{{ USER_NAME }}"
  register: get_uid
  changed_when: false

- name: Get GID of remote group "{{ GROUP_NAME }}"
  command: id -g "{{ GROUP_NAME }}"
  register: get_gid
  changed_when: false

- name: Update facts
  set_fact:
    USER_ID: "{{ get_uid.stdout }}"
    GROUP_ID: "{{ get_gid.stdout }}"
  changed_when: false

# TODO:
# - name: Enumerate initial packages
#   set_fact:
#     # Required for ansible tasks below: python3
#     INITIAL_PACKAGES: "{{ lookup('file', INITIAL_PACKAGE_LIST).splitlines() }} python3"

- name: Build bootstrap image
  docker_image:
    name: "{{ IMAGE_NAME }}"
    build:
      path: "{{ REMOTE_BUILD_DIR }}"
    source: build
  when: build_bootstrap_image | bool

#
# Derive a container from an existing image,
# which may be a bootstrap image generated by the tasks above
#
# Note:
# When deriving from a bootstrap image,
# you must call the role separately and adjust IMAGE_NAME accordingly.
#

- name: Create Debian container
  docker_container:
    name: "{{ CONTAINER_NAME }}"
    hostname: "{{ CONTAINER_NAME }}"
    image: "{{ IMAGE_NAME }}"
    state: started
    detach: true
    command: sleep infinity
  when: (build_container | bool)
