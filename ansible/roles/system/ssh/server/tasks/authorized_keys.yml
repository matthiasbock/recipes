#
# Install a local user's SSH public key in a
# remote user's list of keys authorized
# for password-less login
#
---
- name: Get the path to the local user's home directory
  ansible.builtin.set_fact:
    ssh_local_user_home: "/{{ (ssh_local_user == 'root') | ternary('root', 'home/' ~ ssh_local_user) }}"

- name: Get the path to the remote user's home directory
  ansible.builtin.set_fact:
    ssh_remote_user_home: "/{{ (ssh_remote_user == 'root') | ternary('root', 'home/' ~ ssh_remote_user) }}"

- name: Set the path to the local user's public key
  ansible.builtin.set_fact:
    ssh_local_user_public_key: "{{ ssh_local_user_home }}/.ssh/id_rsa.pub"

- name: Set the path to the remote user's authorized_keys file
  ansible.builtin.set_fact:
    ssh_remote_user_authorized_keys: "{{ ssh_remote_user_home }}/.ssh/authorized_keys"

- name: Check whether the local user exists
  vars:
    ansible_connection: local
    become: true
    become_method: sudo
  stat:
    path: "{{ ssh_local_user_home }}"
  register: local_user_exists
  failed_when: not local_user_exists.stat.exists

- name: Check whether the remote user exists
  stat:
    path: "{{ ssh_remote_user_home }}"
  register: remote_user_exists
  failed_when: not remote_user_exists.stat.exists

- name: "Check whether the local user's public key file exists"
  vars:
    ansible_connection: local
    become: true
    become_method: sudo
  ansible.builtin.stat:
    path: "{{ ssh_local_user_public_key }}"
  register: local_user_public_key_exists
  failed_when: not local_user_public_key_exists.stat.exists

- name: "Ensure <remote user's home>/.ssh directory exists"
  file:
    path: "/home/{{ ssh_remote_user }}/.ssh/"
    state: directory
    mode: 0700
    owner: "{{ ssh_remote_user }}"
    group: "{{ ssh_remote_user }}"

- name: "Ensure <remote user's home>/.ssh/authorized_keys exists"
  become: true
  file:
    path: "{{ ssh_remote_user_authorized_keys }}"
    mode: 0600
    owner: "{{ ssh_remote_user }}"
    group: "{{ ssh_remote_user }}"
    state: touch

- name: "Add public key to <remote user's home>/.ssh/authorized_keys"
  authorized_key:
    user: "{{ ssh_remote_user }}"
    key: "{{ lookup('file', ssh_local_user_public_key) }}"
    path: "{{ ssh_remote_user_authorized_keys }}"
    state: present
    manage_dir: false

