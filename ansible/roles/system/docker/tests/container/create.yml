---
- name: Test container creation
  hosts: all
  tasks:
    - name: Get Docker state
      include_role:
        name: docker
        tasks_from: daemon/state/save.yml

    - name: Ensure Docker is installed
      package:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started

    - name: Test installation
      vars:
        container:
          name: test
          base_image: docker.io/debian:bookworm-slim

      block:
        - name: Create a container
          include_role:
            name: docker
            tasks_from: container/create.yml

        - name: Check whether the container exists
          include_role:
            name: docker
            tasks_from: container/asserts/exists.yml

      always:
        - name: Clean-up created container
          docker_container:
            name: "{{ docker.container.name }}"
            state: absent

        - name: Restore previous Docker state
          include_role:
            name: docker
            tasks_from: daemon/state/restore.yml

