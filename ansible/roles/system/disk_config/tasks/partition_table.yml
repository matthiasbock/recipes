---
- name: Check if disk has existing partitions
  command: "blkid -p /dev/{{ disk.id | regex_replace('^.*-', '') }}"
  register: blkid_result
  changed_when: false
  failed_when: false

- name: Fail if disk has existing partitions and force is not set
  fail:
    msg: "Disk /dev/{{ disk.id | regex_replace('^.*-', '') }} has existing partitions. Set 'force: true' to overwrite."
  when:
    - blkid_result.rc == 0
    - not disk.force | default(false)

- name: Create partition table
  community.general.parted:
    device: "/dev/{{ disk.id | regex_replace('^.*-', '') }}"
    label: "{{ disk.type }}"
  when:
    - disk.type in ['gpt', 'msdos']
    - blkid_result.rc != 0 or disk.force | default(false)

