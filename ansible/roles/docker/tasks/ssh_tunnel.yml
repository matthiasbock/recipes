---
#
# Forward the remote host's Docker Unix socket to the localhost
#
# Switches:
# * start_ssh_tunnel
# * stop_ssh_tunnel
#
- name: Compose SSH login and Docker socket mapping
  ansible.builtin.set_fact:
    DOCKER_SOCK_MAPPING: "{{ DOCKER_SOCK_LOCAL }}:{{ DOCKER_SOCK_REMOTE }}"
    SSH_LOGIN: "{{ ansible_user }}@{{ ansible_host }}"
  changed_when: false
  when:
    - (start_ssh_tunnel | bool) or (stop_ssh_tunnel | bool)

- name: Compose SSH command
  ansible.builtin.set_fact:
    SSH_CMD: "ssh -fNL {{ DOCKER_SOCK_MAPPING }} -o ExitOnForwardFailure=yes {{ SSH_LOGIN }}"
    # ConnectTimeout=3,TCPKeepAlive=yes,ServerAliveInterval=2,ServerAliveCountMax=3,ForwardX11=no
  changed_when: false
  when:
    - (start_ssh_tunnel | bool) or (stop_ssh_tunnel | bool)

- name: Start Docker socket forwarding via SSH tunnel
  delegate_to: localhost
  ansible.builtin.shell:
    cmd: |
      echo "SSH command: {{ SSH_CMD }}" >&2

      # Stop any already running instances of this command
      PID="$(echo "$(ps -eo pid,command | grep -E '[0-9]+\s+ssh ' | fgrep "{{ SSH_LOGIN }}" | fgrep "{{ DOCKER_SOCK_MAPPING }}" | sed -Ee 's/\s*([0-9]+).*$/\1/g')")"
      echo "Already running: $PID" >&2
      [[ "$PID" != "" ]] && kill $PID

      # Remove any left-over socket
      [[ -e "{{ DOCKER_SOCK_LOCAL }}" ]] && rm -vf "{{ DOCKER_SOCK_LOCAL }}" >&2

      # Start SSH tunnel
      set -e
      #timeout --foreground --preserve-status --signal=KILL {{ DOCKER_SOCK_TIMEOUT }} "{{ SSH_CMD }}" &
      {{ SSH_CMD }} || exit 3
      RETVAL=$?
      PID=$!

      [ $RETVAL -eq 0 ] || exit 100+$RETVAL
      echo $PID
  changed_when: false
  when: start_ssh_tunnel | bool

- name: Stop Docker socket forwarding via SSH tunnel
  delegate_to: localhost
  ansible.builtin.shell:
    cmd: |
      PID="$(echo "$(ps -eo pid,command | grep -E '[0-9]+\s+ssh ' | fgrep "{{ SSH_LOGIN }}" | fgrep "{{ DOCKER_SOCK_MAPPING }}" | sed -Ee 's/\s*([0-9]+).*$/\1/g')")"
      echo "Stopping SSH: $PID" >&2
      [[ "$PID" != "" ]] && kill $PID
      [[ -e "{{ DOCKER_SOCK_LOCAL }}" ]] && rm -vf "{{ DOCKER_SOCK_LOCAL }}" >&2
  changed_when: false
  when: stop_ssh_tunnel | bool
