---
#
# Docker image actions
#
# Links:
# * https://docs.ansible.com/ansible/latest/collections/community/docker/docker_image_build_module.html
#

- name: Build Docker image using Dockerfile
  block:
    - name: Create temporary directory
      file:
        path: "{{ IMAGE_BUILD_DIR }}"
        state: directory
        mode: "0755"

    - name: Copy scripts to temporary directory
      template:
        src: "./{{ item }}"
        dest: "{{ IMAGE_BUILD_DIR }}/{{ item }}"
        mode: "0755"
      loop: "{{ IMAGE_ADD_FILES }}"

    - name: Copy templates to temporary directory
      template:
        src: "{{ TEMPLATE_DOCKERFILE }}"
        dest: "{{ IMAGE_BUILD_DIR }}/Dockerfile"
        mode: "0644"

    - name: Use Dockerfile to build container image
      docker_image:
        name: "{{ IMAGE_NAME }}"
        source: build
        build:
          path: "{{ IMAGE_BUILD_DIR }}"

  always:
    - name: Clean-up temporary directory
      file:
        path: "{{ IMAGE_BUILD_DIR }}/{{ item }}"
        state: absent
      loop:
        - convert.sh
        - healthcheck.sh
        - monitor.sh
        - Dockerfile
        - .

  when:
    - create_image | bool


- name: Remove Docker image
  docker_image:
    name: "{{ IMAGE_NAME }}"
    state: absent
  when:
    - remove_image | bool


- name: Commit Docker image
  docker_image_build:
    name: "{{ IMAGE_NAME }}"
    source: container
    container_source: "{{ CONTAINER_NAME }}"
    user: "{{ USER_NAME | default(omit) }}"
    command: "{{ IMAGE_CMD | default(omit) }}"
  when:
    - commit_image | bool


- name: Push Docker image to repository
  docker_image:
    name: "{{ IMAGE_NAME }}"
    repository: "{{ IMAGE_REPO }}"
    push: true
  when:
    - push_image | bool

