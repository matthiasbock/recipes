---
#
# Links:
# * https://docs.ansible.com/ansible/latest/collections/community/docker/docker_container_module.html
#
- name: Create dedicated network
  include_tasks: network/create.yml


- name: Create Docker container
  docker_container:
    name: "{{ docker.container.name }}"
    image: "{{ docker.container.base_image }}"

    user: "{{ docker.container.user }}:{{ docker.container.group }}"

    env: "{{ docker.container.env | default([]) }}"
    volumes: "{{ docker.container.volumes | list + docker.container.additional_volumes | default([]) | list }}"

    restart_policy: "{{ docker.container.restart_policy }}"
    restart_retries: 3

    # TODO:
    # Limit capabilities
    # capabilities:
    #   - chown
    #   - net-broadcast
    # cap_drop:
    #   - all

    networks:
      - name: "{{ docker.network.name }}"
        ipv4_address: "{{ docker.network.subnet.prefix }}.2"
    ports: "{{ docker.container.ports }}"

    # healthcheck:
    #   # Check if nginx server is healthy by curl'ing the server.
    #   # If this fails or timeouts, the healthcheck fails.
    #   test: ["CMD", "curl", "--fail", "http://nginx.host.com"]
    #   interval: 1m30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    #   start_interval: 10s

    log-driver: journald
    state: present
