---
- name: Restore the previous state of the Docker service
  service:
    name: docker
    state: "{{ PREVIOUS_DOCKER_SERVICE_STATE | trim }}"
  ignore_errors: true
  when:
    - restore_docker_state | bool


- name: Restore the previous state of the Docker package
  package:
    name: docker
    state: "{{ PREVIOUS_DOCKER_PACKAGE_STATE | trim}}"
  ignore_errors: true
  when:
    - restore_docker_state | bool
