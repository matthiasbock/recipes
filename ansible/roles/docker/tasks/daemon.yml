---
#
# Operations on the Docker daemon
#
# Switches:
# * install
# * start
# * stop
# * enable
# * disable
#
- name: Ensure Docker is installed
  package:
    name: docker
    state: present
  when: (install | bool) or (start | bool) or (enable | bool)

- name: Ensure Docker is started
  service:
    name: docker
    state: started
  when: start | bool

- name: Ensure Docker is stopped
  service:
    name: docker
    state: stopped
  when: stop | bool

- name: Enable Docker service
  service:
    name: docker
    state: enabled
  when: enable | bool

- name: Disable Docker service
  service:
    name: docker
    state: disabled
  when: disable | bool

