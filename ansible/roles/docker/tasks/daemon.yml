---
#
# Docker daemon actions
#

- name: Ensure Docker is installed
  package:
    name: docker
    state: present
  when: (install_docker | bool) or (start_docker | bool) or (enable_docker | bool)


- name: Ensure Docker is uninstalled
  package:
    name: docker
    state: absent
  when: uninstall_docker | bool


- name: Ensure Docker is started
  service:
    name: docker
    state: started
  when: start_docker | bool


- name: Ensure Docker is stopped
  service:
    name: docker
    state: stopped
  when: stop_docker | bool


- name: Enable Docker service
  service:
    name: docker
    state: enabled
  when: enable_docker | bool


- name: Disable Docker service
  service:
    name: docker
    state: disabled
  when: disable_docker | bool

