---
- name: Need Docker state
  set_fact:
    get_docker_state: true
  when:
    - restore_docker_state | bool


- name: Set image action flag
  set_fact:
    image_action: >-
      {{
          build_image or
          remove_image
      }}


- name: Set container action flag
  set_fact:
    container_action: >-
      {{
          create_container or
          remove_container or
          start_container or
          stop_container or
          get_container_info or
          assert_container_exists
      }}


- name: Need Docker running
  set_fact:
    start_docker: true
  when:
    - (enable_docker | bool) or
      (image_action | bool) or
      (container_action | bool)


- name: Need Docker installed
  set_fact:
    install_docker: true
  when:
    - (start_docker | bool)


- name: Need container info for assert
  set_fact:
    get_container_info: true
  when:
    - assert_container_exists | bool
