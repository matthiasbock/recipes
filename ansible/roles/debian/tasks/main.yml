
- name: Install Debian bootstrapping packages
  apt:
    name:
      - debootstrap
    state: present
    update_cache: yes
  tags: bootstrap

- name: Debootstrap Debian
  command: debootstrap --arch {{ DEBIAN_ARCH }} {{ DEBIAN_VERSION }} "{{ MOUNTPOINT_ROOT }}" "{{ DEBIAN_RESPOSITORY }}"
  tags: bootstrap

- name: Install packages
  apt:
    name:
      - debian-packa
    state: present
    update_cache: yes
  vars:
    ansible_root: "{{ MOUNTPOINT_ROOT }}"
  tags: bootstrap

- name: Configure package management
  template:
    src: apt.conf.d/99secure.j2
    dest: "{{ MOUNTPOINT_ROOT }}/etc/apt/apt.conf.d/99secure"
  tags: bootstrap

- name: Install packages
  apt:
    name: "{{ DEBIAN_PACKAGES }}"
    state: present
    update_cache: yes
  vars:
    ansible_root: "{{ MOUNTPOINT_ROOT }}"
  tags: packages
