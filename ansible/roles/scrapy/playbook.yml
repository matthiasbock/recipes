---
- name: Download a Visual Studio Code extension
  hosts: all
  roles:
    - role: scrapy
      vars:
        update_cache: false
        install_python: false
        create_random_workdir: true
        workdir:
          path: /tmp/scrapy
        cleanup_workdir: false

        vscode_extension:
          name: GitHub.copilot
          download_version: 1.213.986

