---
- name: Download a Visual Studio Code extension
  hosts: all
  vars:
    output_filename: "GitHub.copilot-1.213.986.vsxi"

  roles:
    - role: scrapy
      vars:
        update_cache: false
        install_python: false
        create_random_workdir: true
        workdir:
          path: /tmp/scrapy
        cleanup_workdir: false

        vscode_extension:
          name: GitHub.copilot
          version: 1.213.986
          save_as: "{{ output_filename }}"

