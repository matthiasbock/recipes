---
- name: Create partition
  community.general.parted:
    device: "/dev/{{ disk.id | regex_replace('^.*-', '') }}"
    number: "{{ partition.number }}"
    state: present
    part_end: "{{ partition.size | default('100%') }}"
  when: blkid_result.rc != 0 or disk.force | default(false)

- name: Set up LUKS encryption
  community.crypto.luks_device:
    device: "/dev/{{ disk.id | regex_replace('^.*-', '') }}{{ partition.number }}"
    state: present
    passphrase: "{{ partition.luks_passphrase }}"
  when: partition.luks_encrypted | default(false)

- name: Open LUKS partition
  community.crypto.luks_device:
    device: "/dev/{{ disk.id | regex_replace('^.*-', '') }}{{ partition.number }}"
    state: opened
    name: "{{ partition.luks_name }}"
    passphrase: "{{ partition.luks_passphrase }}"
  when: partition.luks_encrypted | default(false)

- name: Create Physical Volume
  community.general.lvg:
    vg: "{{ partition.vg }}"
    pvs: "{{ '/dev/mapper/' + partition.luks_name if partition.luks_encrypted | default(false) else '/dev/' + disk.id | regex_replace('^.*-', '') + partition.number }}"
  when: partition.type == 'lvm'

- name: Create Volume Group
  community.general.lvg:
    vg: "{{ partition.vg }}"
    pvs: "{{ '/dev/mapper/' + partition.luks_name if partition.luks_encrypted | default(false) else '/dev/' + disk.id | regex_replace('^.*-', '') + partition.number }}"
    pesize: "{{ partition.pesize | default('4') }}"
  when: partition.type == 'lvm'

- name: Create Logical Volume
  community.general.lvol:
    vg: "{{ partition.vg }}"
    lv: "{{ item.name }}"
    size: "{{ item.size }}"
  loop: "{{ partition.volumes }}"
  when: partition.type == 'lvm'

- name: Format partition or logical volume
  community.general.filesystem:
    fstype: "{{ partition.type if partition.type != 'lvm' else item.type }}"
    dev: "{{ '/dev/mapper/' + partition.luks_name if partition.luks_encrypted | default(false) else '/dev/' + disk.id | regex_replace('^.*-', '') + partition.number if partition.type != 'lvm' else '/dev/' + partition.vg + '/' + item.name }}"
    opts: "{{ '-L ' + item.label if item.label is defined else omit }}"
  loop: "{{ [partition] if partition.type != 'lvm' else partition.volumes }}"
  when: blkid_result.rc != 0 or disk.force | default(false)

- name: Mount partition or logical volume
  mount:
    path: "{{ partition.mount.path if partition.type != 'lvm' else item.mount.path }}"
    src: "{{ '/dev/mapper/' + partition.luks_name if partition.luks_encrypted | default(false) else '/dev/' + disk.id | regex_replace('^.*-', '') + partition.number if partition.type != 'lvm' else '/dev/' + partition.vg + '/' + item.name }}"
    fstype: "{{ partition.type if partition.type != 'lvm' else item.type }}"
    opts: "{{ partition.mount.options if partition.type != 'lvm' else item.mount.options }}"
    state: "{{ partition.state if partition.type != 'lvm' else item.state }}"
  loop: "{{ [partition] if partition.type != 'lvm' else partition.volumes }}"
  when: (partition.state | default('') == 'mounted') or (item.state | default('') == 'mounted')
