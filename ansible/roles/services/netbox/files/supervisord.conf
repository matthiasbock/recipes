[supervisord]
nodaemon=true

[program:gunicorn]
command=/opt/netbox/venv/bin/gunicorn --workers 3 --bind 0.0.0.0:8080 netbox.wsgi:application

[program:rqworker]
command=/opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py rqworker

[program:housekeeping]
command=/opt/netbox/netbox/manage.py runscript housekeeping  # Assuming housekeeping is a custom script

