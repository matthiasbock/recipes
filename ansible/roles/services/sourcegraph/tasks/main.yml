---
- name: Ensure Docker is installed
  ansible.builtin.package:
    name: docker
    state: present

- name: Ensure Docker Compose is installed
  ansible.builtin.pip:
    name: docker-compose
    state: present

- name: Create Docker network
  community.docker.docker_network:
    name: "{{ container_network_name }}"
    ipam_config:
      - subnet: "{{ container_ip }}/{{ container_network_mask }}"

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_env.HOME }}/.sourcegraph/config"
    - "{{ ansible_env.HOME }}/.sourcegraph/data"

- name: Copy Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ ansible_env.HOME }}/Dockerfile"
    mode: '0644'

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ansible_env.HOME }}/docker-compose.yml"
    mode: '0644'

- name: Copy nftables.conf
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ ansible_env.HOME }}/nftables.conf"
    mode: '0644'

- name: Copy docker-entrypoint.sh
  ansible.builtin.copy:
    src: docker-entrypoint.sh
    dest: "{{ ansible_env.HOME }}/docker-entrypoint.sh"
    mode: '0755'

- name: Build custom Sourcegraph image
  community.docker.docker_image:
    name: custom-sourcegraph
    build:
      path: "{{ ansible_env.HOME }}"
      dockerfile: Dockerfile
    source: build

- name: Deploy Sourcegraph container
  community.docker.docker_compose:
    project_src: "{{ ansible_env.HOME }}"
    state: present
