---
syncthing:
  # Path to the folder path containing configuration and database on the host
  dir: /var/syncthing

  web_interface:
    port: 8384
    enabled: true

  # List of default ports Syncthing listens on
  ports:
    tcp:
      - "{{ syncthing.web_interface.port }}"
      - 22000
    udp:
      - 22000
      - 21027

  rest_api:
    host: "http://localhost:{{ syncthing.web_interface.port }}"
    health: "{{ syncthing.rest_api.host }}/rest/noauth/health"

