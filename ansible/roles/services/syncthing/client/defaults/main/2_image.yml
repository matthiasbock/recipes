---
image:
  name: syncthing:custom
  from: docker.io/syncthing/syncthing:1.27

  #
  # Specify who will the the owner of all synchronized files
  # Use user and group IDs from the Docker host for compatibility.
  #
  add_user:
    host_user: www-data
  add_group:
    host_group: www-data

  add_files: []
  add_templates:
    - src: healthcheck.sh.j2
      dest: /usr/local/bin/healthcheck.sh
      mode: '0755'

  # Network ports exposed by the image
  expose: "{{ syncthing.ports }}"

  # Configure container health-monitoring
  healthcheck:
    command: /usr/local/bin/healthcheck.sh
    start_period: 30s
    start_interval: 10s
    interval: 300s
    timeout: 60s
    retries: 1

