---
- name: Remove Syncthing container
  include_role:
    name: docker
    tasks_from: container/remove.yml
  vars:
    docker: "{{ syncthing.relay.docker }}"

- name: Remove Syncthing network
  include_role:
    name: docker
    tasks_from: network/remove.yml
  vars:
    docker: "{{ syncthing.relay.docker }}"

