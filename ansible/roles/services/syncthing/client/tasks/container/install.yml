---
- name: Create Docker network for Syncthing client container
  include_role:
    name: docker
    tasks_from: network/create.yml
  vars:
    docker: "{{ syncthing.client.docker }}"


- name: Create Syncthing client container
  include_role:
    name: docker
    tasks_from: container/create.yml
  vars:
    docker: "{{ syncthing.client.docker }}"

