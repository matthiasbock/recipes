---
- name: Allow TCP/IP traffic for IP {{ FIREWALLD_SOURCE }} port {{ FIREWALLD_PORT }}
  firewalld:
    source: "{{ FIREWALLD_SOURCE }}"
    port: "{{ FIREWALLD_PORT }}/tcp"
    permanent: true
    state: enabled
    immediate: yes
  tags: allow_tcp

- name: Disallow TCP/IP traffic for IP {{ FIREWALLD_SOURCE }} port {{ FIREWALLD_PORT }}
  firewalld:
    source: "{{ FIREWALLD_SOURCE }}"
    port: "{{ FIREWALLD_PORT }}/tcp"
    permanent: true
    state: disabled
    immediate: yes
  tags: disallow_tcp
