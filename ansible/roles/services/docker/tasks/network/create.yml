---
#
# https://docs.ansible.com/ansible/latest/collections/community/docker/docker_network_module.html
#
- name: Create Docker network
  docker_network:
    name: "{{ docker.network.name }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: "{{ docker.network.bridge_name }}"
    ipam_config:
      - subnet: "{{ docker.network.subnet.cidr }}"
      # - iprange: "{{ docker.network.subnet.cidr }}"
      # - gateway: "{{ docker.network.subnet.prefix }}.1"
    enable_ipv6: "{{ docker.network.enable_ipv6 }}"
    internal: "{{ docker.network.internal }}"

