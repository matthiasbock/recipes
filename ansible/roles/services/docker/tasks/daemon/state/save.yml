---
- name: Get the state of the Docker daemon (absent/started/stopped)
  block:
    #
    # FIXME: Doesn't work:
    #
    # - name: Get Docker service status
    #   service_facts:
    #
    # - name: Get Docker service status
    #   set_fact:
    #     DOCKER_STATE: "{{ ansible_facts.services['docker.service'].status }}"
    #
    - name: Check if Docker is installed
      command: which docker
      register: which_docker
      ignore_errors: true
      changed_when: false

    - name: Get the state of the Docker service
      shell:
        cmd: |
          systemctl status docker.service |
          head -n10 |
          fgrep 'Active:' |
          sed -Ee 's/^[^\(]*\(([^\)]+)\).*$/\1/g'
      register: docker_service_status
      changed_when: false
      when: which_docker.rc == 0

    - name: Print the docker facts
      debug:
        msg: "{{ docker }}"
      when:
        - debug | default(false) | bool

    - name: Elaborate state
      set_fact:
        docker_package_saved_state: >-
          {% if which_docker.rc == 0 %}
          present
          {% else %}
          absent
          {% endif %}
        docker_service_saved_state: >-
          {% if which_docker.rc != 0 %}
          absent
          {% elif docker_service_status.stdout == 'running' %}
          started
          {% else %}
          stopped
          {% endif %}

    - name: Update docker dictionary
      set_fact:
        docker: >-
          {{
            docker |
            combine({
              'package':{
                'saved_state': docker_package_saved_state | trim
              },
              'service':{
                'saved_state': docker_service_saved_state | trim
              }
            })
          }}

    - name: Print the docker facts
      debug:
        msg: "{{ docker }}"
      when:
        - debug | default(false) | bool

    - name: Print Docker state
      debug:
        msg: |
          Docker package state: {{ docker.package.saved_state }}
          Docker service state: {{ docker.service.saved_state }}
      changed_when: false
