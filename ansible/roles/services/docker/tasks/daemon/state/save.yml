---
- name: Get the state of the Docker package
  block:
    - name: Check if Docker is installed
      package_facts:
        manager: auto
      changed_when: false

    - name: Set temporary package state fact
      set_fact:
        docker_package_saved_state: >-
          {% if docker.package.name in ansible_facts.packages %}
          present
          {% else %}
          absent
          {% endif %}
        docker: >-
          {{
            docker |
            combine({
              'package': {
                'is_installed': (docker.package.name in ansible_facts.packages) | bool
              }
            })
          }}

    - name: Update docker.package fact
      set_fact:
        docker: >-
          {{
            docker |
            combine({
              'package': {
                'saved_state': docker_package_saved_state | trim
              }
            })
          }}

    - name: Unset temporary package fact
      set_fact:
        docker_package_saved_state: null


- name: Check if a systemd docker unit exists
  stat:
    path: "{{ docker.service.filepath }}"
  register: docker_service_unit


- name: Get the state of the Docker service
  block:
    - name: Use systemctl to query the status of the Docker service
      shell:
        cmd: |
          systemctl status docker.service |
          head -n10 |
          fgrep 'Active:' |
          sed -Ee 's/^[^\(]*\(([^\)]+)\).*$/\1/g'
      register: docker_service_status
      changed_when: false
      when: docker.package.is_installed

    - name: Set temporary service state fact
      set_fact:
        docker_service_saved_state: >-
          {% if (not docker.package.is_installed) or (not docker_service_unit.stat.exists) %}
          absent
          {% elif docker_service_status.stdout == 'running' %}
          started
          {% else %}
          stopped
          {% endif %}

    - name: Update docker service fact
      set_fact:
        docker: >-
          {{
            docker |
            combine({
              'service':{
                'saved_state': docker_service_saved_state | trim
              }
            })
          }}
        docker_service_saved_state: null

  # This task is always run. The sub-task setting the saved state
  # is capable of detecting if the Docker package or service unit is absent.
  # when:
    # Docker is installed
    # - docker.package.is_installed
    # Docker service unit exists
    # - docker_service_unit.stat.exists

