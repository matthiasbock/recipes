---
network: false
container: false

install: false
uninstall: false
start: false
stop: false


# Container instantiation
SYNCTHING_BASE_IMAGE: docker.io/syncthing/syncthing:1.27
SYNCTHING_CONTAINER_NAME: syncthing
SYNCTHING_CONTAINER_HOSTNAME: "{{ ansible_host | default('syncthing') }}"

# Container network setup
SYNCTHING_CONTAINER_IP: 172.18.9.2
SYNCTHING_CONTAINER_SUBNET: 172.18.9.0/30
# SYNCTHING_CONTAINER_IP_RANGE: 172.17.9.0/30

SYNCTHING_CONTAINER_NETWORKS: []
SYNCTHING_NETWORK_NAME: syncthing_network
SYNCTHING_BRIDGE_NAME: br_syncthing

# Network ports published by the container
SYNCTHING_CONTAINER_PORTS:
  - 8384:8384/tcp
  - 22000:22000/tcp
  - 22000:22000/udp
  - 21027:21027/udp

# Folder path to configuration and database within the container
SYNCTHING_ROOT: /var/syncthing

# Health status reporting via Prometheus
SYNCTHING_PROMETHEUS_FILEPATH: /var/lib/prometheus/node-exporter/syncthing_health.prom
SYNCTHING_PROMETHEUS_METRIC: syncthing_health_status

# Private key and certificate for SSL encrypted web interface
SYNCTHING_SSL_PRIVKEY: /etc/letsencrypt/live/{{ ansible_host }}/privkey.pem
SYNCTHING_SSL_CERT: /etc/letsencrypt/live/{{ ansible_host }}/fullchain.pem

# Files and folder shared between host and container
SYNCTHING_CONTAINER_VOLUMES:
  - "{{ SYNCTHING_ROOT }}:/var/syncthing:rw"
  - "{{ SYNCTHING_SSL_PRIVKEY }}:/var/syncthing/config/https-key.pem:ro"
  - "{{ SYNCTHING_SSL_CERT }}:/var/syncthing/config/https-cert.pem:ro"
  - "{{ SYNCTHING_PROMETHEUS_FILEPATH }}:{{ SYNCTHING_PROMETHEUS_FILEPATH }}"

# Variable for additional, user-defined files and folders to be shared between host and container
SYNCTHING_CONTAINER_ADDITIONAL_VOLUMES: []

# User and group ownership of synchronized files.
# Use user and group IDs from the Docker host for compatibility.
SYNCTHING_USER: www-data
SYNCTHING_GROUP: www-data
