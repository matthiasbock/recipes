---
#
# Dedicated container network
#
CONTAINER_NETWORK_SUBNET: 172.18.9.0/30
CONTAINER_NETWORK_NAME: syncthing_network
CONTAINER_NETWORK_BRIDGE_NAME: br_syncthing


#
# Path to the private key and certificate to use for https (web interface)
#
SSL_PRIVATE_KEY: /etc/letsencrypt/live/{{ ansible_host }}/privkey.pem
SSL_CERTIFICATE: /etc/letsencrypt/live/{{ ansible_host }}/fullchain.pem


#
# Health status reporting via Prometheus
#
PROMETHEUS_FILEPATH: /var/lib/prometheus/node-exporter/syncthing_health.prom
PROMETHEUS_METRIC:   syncthing_health_status


#
# Container
#
CONTAINER_NAME: syncthing
CONTAINER_BASE_IMAGE: syncthing:custom
CONTAINER_HOSTNAME: "{{ ansible_host | default('syncthing') }}"
CONTAINER_IP: 172.18.9.2
CONTAINER_NETWORKS:
  - {{ CONTAINER_NETWORK_NAME }}

# Files and folder shared between host and container
CONTAINER_VOLUMES:
  - "{{ SYNCTHING_ROOT }}:/var/syncthing:rw"
  - "{{ SSL_PRIVATE_KEY }}:/var/syncthing/config/https-key.pem:ro"
  - "{{ SSL_CERTIFICATE }}:/var/syncthing/config/https-cert.pem:ro"
  - "{{ PROMETHEUS_FILEPATH }}:{{ PROMETHEUS_FILEPATH }}"

# The user and group as whom to start syncthing within the container
CONTAINER_USER: www-data
CONTAINER_GROUP: www-data
