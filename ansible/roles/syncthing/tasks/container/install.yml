---
- name: Get user ID
  command: "id -u {{ SYNCTHING_USER }}"
  register: syncthing_user
  changed_when: false
  when:
    - install | bool
    - container | bool


- name: Get group ID
  command: "id -g {{ SYNCTHING_GROUP }}"
  register: syncthing_group
  changed_when: false
  when:
    - install | bool
    - container | bool


- name: Compile Syncthing container environment
  set_fact:
    SYNCTHING_CONTAINER_ENV:
      CONTAINER_NAME: "{{ SYNCTHING_CONTAINER_NAME }}"
      PUID: "{{ syncthing_user.stdout }}"
      PGID: "{{ syncthing_group.stdout }}"
      PROMETHEUS_FILE: "{{ SYNCTHING_PROMETHEUS_FILEPATH }}"
      PROMETHEUS_METRIC: "{{ SYNCTHING_PROMETHEUS_METRIC }}"
  changed_when: false
  when:
    - install | bool
    - container | bool


- name: Set up Docker network for Syncthing
  docker_network:
    name: "{{ SYNCTHING_NETWORK_NAME }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: "{{ SYNCTHING_BRIDGE_NAME }}"
    ipam_config:
      - subnet: "{{ SYNCTHING_CONTAINER_SUBNET }}"
      # - iprange: "{{ SYNCTHING_CONTAINER_IP_RANGE }}"
    enable_ipv6: false
    internal: true
  when:
    - install | bool
    - container | bool
    - network | bool


- name: Compose Syncthing container network setting
  set_fact:
    SYNCTHING_CONTAINER_NETWORKS:
      - name: "{{ SYNCTHING_NETWORK_NAME }}"
        ipv4_address: "{{ SYNCTHING_CONTAINER_IP }}"
  changed_when: false
  when:
    - install | bool
    - container | bool
    - network | bool



# TODO:
# template: Dockerfile.j2 /tmp
# copy healthcheck.sh /tmp



# - name: Build Syncthing container with healthcheck
# name: syncthing/custom
# build_dir: /tmp


- name: Create Syncthing container
  docker_container:
    name: "{{ SYNCTHING_CONTAINER_NAME }}"
    image: "{{ SYNCTHING_BASE_IMAGE }}"
    env: "{{ SYNCTHING_CONTAINER_ENV }}"
    volumes: "{{ SYNCTHING_CONTAINER_VOLUMES + SYNCTHING_CONTAINER_ADDITIONAL_VOLUMES }}"
    restart_policy: unless-stopped
    restart_retries: 20

    # TODO:
    # Limit capabilities
    # capabilities:
    #   - chown
    #   - net-broadcast
    # cap_drop:
    #   - all

    networks: "{{ SYNCTHING_CONTAINER_NETWORKS }}"
    ports: "{{ SYNCTHING_CONTAINER_PORTS }}"

    # healthcheck:
    #   # Check if nginx server is healthy by curl'ing the server.
    #   # If this fails or timeouts, the healthcheck fails.
    #   test: ["CMD", "curl", "--fail", "http://nginx.host.com"]
    #   interval: 1m30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    #   start_interval: 10s

    log-driver: journald
    state: present
  when:
    - install | bool
    - container | bool


- name: Remove all but selected containers from Syncthing network
  docker_network:
    name: "{{ SYNCTHING_NETWORK_NAME }}"
    connected:
      - "{{ SYNCTHING_CONTAINER_NAME }}"
  when:
    - install | bool
    - container | bool
    - network | bool


- name: Start Syncthing container
  docker_container:
    name: "{{ SYNCTHING_CONTAINER_NAME }}"
    state: started
  when:
    - start | bool
    - container | bool


- name: Stop Syncthing container
  docker_container:
    name: "{{ SYNCTHING_CONTAINER_NAME }}"
    state: stopped
  when:
    - stop | bool
    - container | bool


- name: Remove Syncthing container
  docker_container:
    name: "{{ SYNCTHING_CONTAINER_NAME }}"
    state: absent
  when:
    - uninstall | bool
    - container | bool


- name: Remove Syncthing network
  docker_network:
    name: "{{ SYNCTHING_NETWORK_NAME }}"
    state: absent
  when:
    - uninstall | bool
    - network | bool


---
- name: Test Syncthing container creation
  hosts: all

  tasks:
    - name: Get Docker state
      include_role:
        name: docker
      vars:
        get_docker_state: true

    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started

    - name: Test installation
      block:
        - name: Create and start Syncthing container
          include_role:
            name: syncthing
          vars:
            container: true
            network: true
            install: true
            start: true

        - name: List containers
          command: 'docker container ls -a --format \"\{\{.Names\}\}\"'
          register: containers
          changed_when: false

        - name: List containers
          debug:
            msg: "{{ containers.stdout.splitlines() }}"

        - name: Check if container exists
          assert:
            that: "{{ SYNCTHING_CONTAINER_NAME in containers.stdout }}"
            fail_msg: "Container not present after installation: {{ SYNCTHING_CONTAINER_NAME }}"

      always:
        - name: Restore previous Docker state
          include_role:
            name: docker
          vars:
            restore_docker_state: true

