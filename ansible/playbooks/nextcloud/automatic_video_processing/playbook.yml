---
- name: NextCloud video converter
  hosts:
    - nextcloud_servers
  vars:
    NEXTCLOUD_DATA_DIR: /path/to/nextcloud/data
    IMAGE_NAME: video_processor:latest
    BUILD_DIR: /tmp

    CONTAINER_NAME: video_processor
    CONTAINER_USER: www-data
    CONTAINER_GROUP: www-data

    CONTAINER_CMD: /usr/local/bin/container_cmd.sh
    PROCESS_VIDEO: /usr/local/bin/process_video.sh

  tasks:
    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present

    - name: Remove container
      docker_container:
        name: "{{ CONTAINER_NAME }}"
        state: absent
      tags: uninstall

    - name: Remove image
      docker_image:
        name: "{{ IMAGE_NAME }}"
        state: absent
      tags: uninstall

    - name: Create build directory
      file:
        path: "{{ BUILD_DIR }}"
        state: directory
        mode: '0755'
      tags: install

    - name: Get UID of user www-data
      command: id -u www-data
      register: www_data_uid
      tags: install

    - name: Set UID
      set_fact:
        UID: "{{ www_data_uid.stdout }}"

    - name: Get GID of group www-data
      command: id -g www-data
      register: www_data_gid
      tags: install

    - name: Set GID
      set_fact:
        GID: "{{ www_data_gid.stdout }}"

    - name: Copy temporary files to remote host
      template:
        src: "./{{ item }}"
        dest: "{{ BUILD_DIR }}/{{ item }}"
        mode: '0755'
      loop:
        - Dockerfile
        - process_video.sh
        - container_cmd.sh
      tags: install

    - name: Build image
      docker_image:
        name: "{{ IMAGE_NAME }}"
        build:
          path: "{{ BUILD_DIR }}"
        source: build
      tags: install

    - name: Remove temporary files
      file:
        path: "{{ BUILD_DIR }}/{{ item }}"
        state: absent
      loop:
        - Dockerfile
        - container_cmd.sh
        - process_video.sh
      tags: install

    - name: Create container
      docker_container:
        name: "{{ CONTAINER_NAME }}"
        image: "{{ IMAGE_NAME }}"
        user: "{{ UID }}:{{ GID }}"
        restart_policy: unless-stopped
        volumes:
          - "{{ NEXTCLOUD_DATA_DIR }}:/watch:rw"
        state: started
      tags: install
