---
- name: Install Android app on connected devices
  hosts: localhost
  vars:
    APK_PATH: "/path/to/your/app.apk"  # Path to the APK file to be installed

  tasks:
    - name: Ensure adb is installed
      package:
        name: adb
        state: present

    - name: List connected devices
      command: adb devices
      register: adb_devices_output

    - name: Parse connected devices
      set_fact:
        connected_devices: "{{ adb_devices_output.stdout_lines | select('match', 'device$') | list }}"

    - name: Install APK on connected devices
      command: adb -s "{{ item.split('\t')[0] }}" install -r "{{ APK_PATH }}"
      loop: "{{ connected_devices }}"
      when: connected_devices | length > 0
      ignore_errors: yes

    - name: Fail if no devices are connected
      fail:
        msg: "No connected devices found. Please connect a device and enable USB debugging."
      when: connected_devices | length == 0
