---
- name: Set up a Debian container
  hosts: all
  vars:
    BASE_IMAGE: docker.io/debian:bookworm-slim

    CONTAINER_NAME: debian


  roles:
    - role: docker
      vars:
        install: true
        start: true

    - role: docker
      vars:
        stop_container: true
        remove_container: true
        remove_image: true

    - role: docker
      vars:
        build_image: true

    - role: debian_container
      vars:
        create: true

    - role: docker
      vars:
        start_ssh_tunnel: true

    - role: debian_container
      vars:
        ansible_connection: docker
        ansible_docker_extra_args: "--host {{ DOCKER_HOST }}"
        ansible_host: "{{ CONTAINER_NAME }}"
        ansible_user: root

        SOURCES_LIST_FILES:
          - bookworm.list
          - bullseye.list
          - vscodium.list
          - jitsi.list
          - signal-messenger.list
          - wire-messenger.list

        PACKAGE_BUNDLE_FILES:
          - debian-essentials.list
          - console-tools.list
          - python3.list
          - version-control.list

        install: true

    - role: docker
      vars:
        stop_ssh_tunnel: true
