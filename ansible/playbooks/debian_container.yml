---
- name: Set up a Debian container
  hosts: all
  vars:
    BASE_IMAGE: docker.io/debian:bookworm-slim

    CONTAINER_NAME: debian

    SOURCES_LIST_FILES:
      - bookworm.list
      - bullseye.list
      - vscodium.list
      - jitsi.list
      - signal-messenger.list
      - wire-messenger.list

    PACKAGE_BUNDLE_FILES:
      - debian-essentials.list
      - console-tools.list
      - python3.list
      - version-control.list

  roles:
    - role: debian_container
