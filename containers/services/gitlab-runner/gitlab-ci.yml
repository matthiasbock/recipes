
#
# A GitLab CI jobs runner coordinator with augmentations
#
gitlab-runner:
  rules:
    - changes:
      - containers/services/gitlab-runner/**/*
    - when: manual
  variables:
    CONFIG: "environments/services/gitlab-runner/config.sh"
    BASE_IMAGE: "docker.io/gitlab/gitlab-runner:ubuntu"
    MERGE_IMAGE: "registry.bihealth.org:443/bockm/recipes/debian:bullseye-amd64"
    IMAGE_REPOSITORY: "registry.bihealth.org:443/bockm/recipes/services:gitlab-runner"
  script:
    - . /etc/profile
    - make container_image push
