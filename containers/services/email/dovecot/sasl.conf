
# SASL-Authentifizierungsdienst für Postfix
service auth {
  inet_listener {
    port = 12345
    # Erlaubt Verbindungen vom Postfix-Container
    address = *
  }
}

# LMTP-Server für die Mailzustellung
service lmtp {
  inet_listener lmtp {
    port = 24
    # Erlaubt Verbindungen vom Postfix-Container
    address = *
  }
}
