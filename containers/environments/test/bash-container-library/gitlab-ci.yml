
#
# A test environment for the bash-container-library
#
testenv_bash-container-library:
  stage: build
  only:
    changes:
      - containers/environments/test/bash-container-library/**/*
  variables:
    CONFIG: environments/test/bash-container-library/config.sh
    BASE_IMAGE: registry.bihealth.org:443/bockm/recipes/debian:bullseye-amd64
    IMAGE_REPOSITORY: registry.bihealth.org:443/bockm/recipes/testenv:bash-container-library
  script:
    - echo "Building container..."
    - ./containers/build.sh $CONFIG
    - echo "Creating image from container..."
    - ./containers/commit.sh $CONFIG
    - echo "Publishing image to container registry..."
    - ./containers/push.sh $CONFIG
