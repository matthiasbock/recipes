
buildenv_simulations:
  rules:
    - changes:
      - containers/environments/build/simulations/**/*
    - when: manual
  variables:
    CONFIG: "environments/build/simulations/config.sh"
    BASE_IMAGE: "registry.bihealth.org:443/bockm/recipes/debian:bullseye-amd64"
    IMAGE_REPOSITORY: "registry.bihealth.org:443/bockm/recipes/buildenv:simulations"
  script:
    - make container container_image push_image
