
#
# A build environment for my mesh-tools
#
buildenv_mesh-tools:
  rules:
    - changes:
      - containers/environments/build/mesh-tools/**/*
    - when: manual
  variables:
    CONFIG: "environments/build/mesh-tools/config.sh"
    BASE_IMAGE: "registry.bihealth.org:443/bockm/recipes/debian:bullseye-amd64"
    IMAGE_REPOSITORY: "registry.bihealth.org:443/bockm/recipes/buildenv:mesh-tools"
  script:
    - echo "Building container..."
    - ./containers/build.sh $CONFIG
    - echo "Creating image from container..."
    - ./containers/commit.sh $CONFIG
    - echo "Publishing image to container registry..."
    - ./containers/push.sh $CONFIG
