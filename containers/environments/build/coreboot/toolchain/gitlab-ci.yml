
#
# Compile the toolchain required for building coreboot
#
buildenv_coreboot-toolchain:
  stage: build
  rules:
    - changes:
      - containers/environments/build/coreboot/toolchain/*
    - when: manual
  needs: ["buildenv_coreboot"]
  variables:
    CONFIG: "environments/work/coreboot/config.sh"
    BASE_IMAGE: "registry.bihealth.org:443/bockm/recipes/buildenv:coreboot"
    IMAGE_REPOSITORY: "registry.bihealth.org:443/bockm/recipes/workenv:coreboot"
  script:
    - echo "Building container..."
    - ./containers/build.sh $CONFIG
    - echo "Creating image from container..."
    - ./containers/commit.sh $CONFIG
    - echo "Publishing image to container registry..."
    - ./containers/push.sh $CONFIG
