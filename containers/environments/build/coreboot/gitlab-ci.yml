
#
# Build environment for coreboot
#
buildenv_coreboot:
  stage: build
  rules:
    - changes:
      - containers/environments/build/coreboot/**/*
    - when: manual
  allow_failure: true
  variables:
    CONFIG: "environments/build/coreboot/config.sh"
  script:
    - echo "Building container..."
    - ./containers/build.sh $CONFIG
    - echo "Creating image from container..."
    - ./containers/commit.sh $CONFIG
    - echo "Publishing image to container registry..."
    - ./containers/push.sh $CONFIG
