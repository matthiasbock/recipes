
#
# The gitlab-runner executor container that is used
# to build the containers defined within this project
#
buildenv_containers:
  rules:
    - when: manual
    - changes:
      - containers/environments/build/containers/**/*
  variables:
    CONFIG: "environments/build/containers/config.sh"
    BASE_IMAGE: "registry.bihealth.org:443/bockm/recipes/debian:bullseye-amd64"
    IMAGE_REPOSITORY: "registry.bihealth.org:443/bockm/recipes/buildenv:containers"
  script:
    - echo "Building container..."
    - ./containers/build.sh $CONFIG
    - echo "Creating image from container..."
    - ./containers/commit.sh $CONFIG
    - echo "Publishing image to container registry..."
    - ./containers/push.sh $CONFIG
