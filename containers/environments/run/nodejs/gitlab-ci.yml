
runenv_nodejs:
  stage: build
  rules:
    - changes:
      - containers/environments/run/nodejs/**/*
    - when: manual
  needs: ["debian_bullseye-amd64"]
  variables:
    CONFIG: "environments/run/nodejs/config.sh"
    BASE_IMAGE: "registry.bihealth.org:443/bockm/recipes/debian:bullseye-amd64"
    IMAGE_REPOSITORY: "registry.bihealth.org:443/bockm/recipes/runenv:nodejs"
  script:
    - make container container_image push_image
