
debian_bullseye-amd64:
  stage: build
  only:
    changes:
      - containers/systems/debian/bullseye-amd64.sh
      - containers/systems/debian/common.sh
      - containers/systems/debian/helper.sh
      - containers/systems/debian/gitlab-ci.yml
  variables:
    CONFIG: systems/debian/bullseye-amd64.sh
  script:
    - echo "Building container..."
    - ./containers/build.sh $CONFIG
    - echo "Creating image from container..."
    - ./containers/commit.sh $CONFIG
    - echo "Publishing image to container registry..."
    - ./containers/push.sh $CONFIG


debian_buster-amd64:
  stage: build
  only:
    changes:
      - containers/systems/debian/buster-amd64.sh
      - containers/systems/debian/common.sh
      - containers/systems/debian/helper.sh
      - containers/systems/debian/gitlab-ci.yml
  variables:
